{% load shop_extras %}
<div class="bg-white shadow-xl ring-1 ring-black/5 rounded-lg px-4 py-3 text-sm font-medium border-l-4 border-accent flex items-center gap-3"
     x-data="{show:true}" x-show="show" x-init="setTimeout(()=>show=false,3500)" x-transition>
  <span class="text-accent shrink-0">{% icon "check" "w-5 h-5" %}</span>
  <span class="flex-1">«{{ added.title|truncatechars:28 }}» в корзине</span>
  <a href="{% url 'cart:detail' %}" class="text-accent font-semibold underline whitespace-nowrap">Оформить</a>
</div>
<span id="cart-count" hx-swap-oob="true"
      class="absolute -top-1 right-0 bg-accent text-white text-[10px] font-bold rounded-full h-4 min-w-4 px-1 grid place-items-center">{{ cart|length }}</span>
