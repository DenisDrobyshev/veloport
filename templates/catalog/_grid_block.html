{% load shop_extras %}
<div class="flex items-center justify-between mb-4">
  <p class="text-sm text-slate-500">Найдено товаров: <b class="text-ink">{{ total_count }}</b></p>
</div>
{% if products %}
<div class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-3 md:gap-4">
  {% for product in products %}{% include "partials/product_card.html" %}{% endfor %}
</div>
{% include "partials/pagination.html" %}
{% else %}
<div class="text-center py-24 bg-white rounded-2xl ring-1 ring-slate-100">
  <div class="text-6xl">🔍</div>
  <p class="mt-4 text-lg font-semibold">Ничего не найдено</p>
  <p class="text-slate-500 mt-1">Попробуйте ослабить фильтры или сбросить их</p>
</div>
{% endif %}
