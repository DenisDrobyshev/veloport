{% load shop_extras %}
{% if products %}
<div class="absolute left-0 right-0 top-full mt-1 bg-white rounded-lg shadow-2xl ring-1 ring-black/5 overflow-hidden z-50">
  {% for p in products %}
  <a href="{{ p.get_absolute_url }}" class="flex items-center gap-3 px-3 py-2 hover:bg-slate-50">
    <div class="w-10 h-10 rounded bg-slate-50 overflow-hidden shrink-0">
      {% if p.main_image %}<img src="{{ p.main_image.url }}" class="w-full h-full object-cover">{% endif %}
    </div>
    <div class="min-w-0 flex-1">
      <div class="text-sm font-medium line-clamp-1">{{ p.title }}</div>
      <div class="text-xs text-slate-400">{{ p.brand.name }}</div>
    </div>
    <div class="text-sm font-bold whitespace-nowrap">{{ p.price|rub }}</div>
  </a>
  {% endfor %}
</div>
{% elif q %}
<div class="absolute left-0 right-0 top-full mt-1 bg-white rounded-lg shadow-xl ring-1 ring-black/5 px-3 py-3 text-sm text-slate-400 z-50">Ничего не найдено</div>
{% endif %}
