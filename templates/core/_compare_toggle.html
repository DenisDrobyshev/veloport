{% load shop_extras %}
<div class="bg-white shadow-xl ring-1 ring-black/5 rounded-lg px-4 py-3 text-sm font-medium border-l-4 border-ink flex items-center gap-3"
     x-data="{show:true}" x-show="show" x-init="setTimeout(()=>show=false,3000)" x-transition>
  <span>{% icon "compare" "w-5 h-5" %}</span>
  <span class="flex-1">Добавлено к сравнению</span>
  <a href="{% url 'core:compare' %}" class="text-accent font-semibold underline whitespace-nowrap">Сравнить ({{ count }})</a>
</div>
